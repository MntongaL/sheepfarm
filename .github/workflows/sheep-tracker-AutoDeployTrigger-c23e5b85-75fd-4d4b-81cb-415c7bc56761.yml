name: Trigger auto deployment for sheep-tracker

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/sheep-tracker-AutoDeployTrigger-c23e5b85-75fd-4d4b-81cb-415c7bc56761.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SHEEPTRACKER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SHEEPTRACKER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SHEEPTRACKER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.SHEEPTRACKER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SHEEPTRACKER_REGISTRY_PASSWORD }}
          containerAppName: sheep-tracker
          resourceGroup: sheep-tracker
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


