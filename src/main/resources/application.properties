# Root logging level
logging.level.root=INFO

# Your application
logging.level.za.co.sheeptracker=DEBUG

# Spring database exceptions
logging.level.org.springframework.dao=DEBUG
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=WARN

# Log to file
logging.file.name=logs/sheep-tracker.log

# Rolling policy
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14

# Include timestamps and logger names
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Access token: 30 minutes
app.jwt.access-token-expiration-ms=1800000

# Refresh token: 7 days
app.jwt.refresh-token-expiration-ms=604800000