spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sheep_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:change-this-in-production-to-a-long-random-secret-key-min-256-bits}
    access-token-expiration-ms: ${JWT_ACCESS_EXP:900000}      # 15 min
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP:1209600000} # 14 days
  cors:
    allowed-origins: ${CORS_ORIGINS:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    root: INFO

    # Your application classes
    za.co.sheeptracker: DEBUG

    # Spring database access and transactions
    org.springframework.dao: DEBUG
    org.springframework.orm.jpa: INFO
    org.springframework.transaction: INFO

    # Hibernate SQL and database exceptions
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: WARN
    org.hibernate.SQL: DEBUG

    # PostgreSQL connection pool
    com.zaxxer.hikari: INFO

  file:
    name: logs/sheep-tracker.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"